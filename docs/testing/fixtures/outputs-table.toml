# Configuration-only fixture: both output selectors (CFG-20, ADR 0026, ADR 0027).
# The fixed name is the silent sink created by apply-fixture.sh for its microphone.
# Both work: the fixed output on knob 7 (OUT-01) and slider 7 following the default
# (OUT-03, ADR 0038). No output moves in these cases: slider 7 would set your own
# default output.
[log]
level = "debug"
outputs = ["journald"]

[inputs.mic]
name = "Test microphone"
match = ["apptrol-test-mic"]

[outputs.main]
name = "Main volume"
device = "default"
max_volume = 80

[outputs.speakers]
name = "Test output"
match = ["apptrol-test-mic-sink"]
max_volume = 80

[layouts.default]
slider7 = "main"
knob7 = "speakers"
slider8 = "mic"
