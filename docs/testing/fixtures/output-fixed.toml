# Test fixture "output-fixed": fixed outputs on the silent test output (OUT-01,
# OUT-02, OUT-04, OUT-06, ADR 0027, ADR 0035). apply-fixture.sh creates apptrol-test-mic-sink for its
# virtual microphone; it plays nothing, so no volume here can be heard.
# For: TC-OUT-003 (first owner), TC-OUT-004 (several matches), TC-OUT-006 (mute).
# Slider6 owns the mic sink when no extra test sink exists. TC-OUT-004 exercises transfer.
# TestFixturesAreValid in internal/config checks that it loads.

[log]
level   = "debug"                  # the cases read the log
outputs = ["journald"]

[outputs.test-out]
name       = "Test output"
match      = ["apptrol-test-mic-sink"]
max_volume = 80

[outputs.test-out-knob]
name  = "Test output (knob)"
match = ["apptrol-test-mic-sink"]  # ignored while an earlier slider owns it (OUT-04)

[outputs.any-test]
name  = "Any test output"
match = ["apptrol-test"]           # every test output: TC-OUT-004 adds a second one
max_volume = 80

[layouts.default]
slider7 = "test-out"
knob7   = "test-out-knob"
slider6 = "any-test"
