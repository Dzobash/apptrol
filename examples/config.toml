# Apptrol configuration
# Location: ~/.config/apptrol/config.toml
# The file is reloaded automatically when you save it.
# Full reference: docs/config.md

# ── Controller ────────────────────────────────────────────────────────────────
[controller]
# ALSA card id of the controller (case-insensitive). It is the name in brackets
# in `cat /proc/asound/cards`, e.g. " 1 [nanoKONTROL2   ]: USB-Audio - nanoKONTROL2".
port = "nanoKONTROL2"
# Several users on this computer? While another user's session is in front
# (Switch user), Apptrol lets go of the controller, so their own Apptrol can
# use it. At the login screen it keeps the controller unless this says
# "release": "keep" (default) or "release".
# at_login_screen = "keep"

# ── Logging ───────────────────────────────────────────────────────────────────
[log]
level   = "warn"                   # debug | info | warn | error; "info" shows every
                                   # mute, solo and app found, for troubleshooting
outputs = ["journald"]             # "journald", "file", or both

[log.journald]
format = "text"                    # text | logfmt

[log.file]
path      = "~/.local/state/apptrol/apptrol.log"
format    = "json"                 # text | json | logfmt
max_size  = "10MB"                 # rotate when the file reaches this size
max_files = 5                      # rotated files to keep

# ── Apps, inputs and outputs ─────────────────────────────────────────────────
# Apps (the sound a program plays) go in [apps.<id>], inputs (a microphone or
# another capture device) in [inputs.<id>], outputs in [outputs.<id>]. Each entry
# is defined once and referred to by its id (the part after the table name); an id
# may be used in only one of the three tables.
# `match` is a list of case-insensitive name fragments.
# Run `apptrol list` to see stream, input and output names.
# Without Apptrol: `pactl list short sources` for inputs;
# `pactl list short sinks` for outputs.
# For inputs and fixed outputs, match a case-insensitive part of the name or
# description. Use the full name if a short part fits several devices; the first
# by name is used with a warning, and kept while it still matches.
# Monitors (<output>.monitor) record what an output plays and are never matched
# as inputs or outputs. A fragment ending in .monitor warns on every load and
# in `apptrol check`, but stays valid; use the output's name without .monitor.

[apps.spotify]
name  = "Spotify"
match = ["spotify"]
# max_volume = 150                 # % at the top of the control (1–150, default 100)
#   Hearing safety: above 100 % the sound is amplified in software. Loud sound,
#   above all on headphones, can damage your hearing, and the first move of a
#   control sets its volume at once. We recommend 100 or less. You are responsible
#   for the volumes you set; Apptrol comes without warranty (see LICENSE).

[apps.browser]
name  = "Browser"
match = ["vivaldi", "firefox", "chrome"]

[apps.discord]
name  = "Discord"
match = ["discord", "vesktop"]

[apps.games]
name  = "Steam games"
match = ["steam"]

[inputs.mic]
name  = "Microphone"
match = ["GoXLR"]                  # part of the input device's name
# talk_over_volume = 25            # % apps go down to during talk-over (0–100, default 25)

# An output's control sets the whole device's volume (speakers, headphones);
# the apps keep their own volumes. Until the control is moved, Apptrol leaves
# the output's volume alone. M mutes the output; outputs have no solo, so S
# does nothing on an output column.
# Choose exactly one: match = ["Speaker"] for a fixed output, or
# device = "default" for the output your system uses right now (the only device
# value). It moves with the system's default at once; the new default keeps its
# own volume until you move the control, and the control's mute goes with it.
# If the default is also a fixed output's device, the earlier control owns it
# (sliders 1–8, then knobs 1–8); the other does nothing meanwhile.
# `device` is only for outputs; `type` and `talk_over_volume` are not allowed here.
# [outputs.speakers]
# name = "Speakers"
# match = ["Speaker"]              # part of the output's name, from `apptrol list`
# max_volume = 100                 # 1–150, default 100; we recommend 100 or less
#   Output volume is the last software level before speakers or headphones.
#   Above 100 % it is amplified and can damage your hearing. The first move sets
#   the volume at once: put the slider low before you enable it. You are
#   responsible for the volumes you set; no warranty.
# [outputs.main]
# name = "Main volume"
# device = "default"

# ── Layouts ───────────────────────────────────────────────────────────────────
# Phase 1 uses only the layout called "default".
# Controls: slider1–slider8 and knob1–knob8 (numbered left to right).
# S / M buttons belong to the slider in the same column.

[layouts.default]
slider1 = "spotify"
slider2 = "browser"
slider3 = "discord"
slider4 = "games"
# slider6 = "main"                # after enabling [outputs.main]
# slider7 = "speakers"            # after enabling [outputs.speakers]
slider8 = "mic"

# ── Buttons ───────────────────────────────────────────────────────────────────
# Every button has a default; uncomment a line to change it. Full list: docs/config.md
#
# On a column with an app:  S = solo, M = mute, R = play / pause that app.
# On a column with an input (microphone):
#   M  "mute"         – press: muted, press again: live (default). Works as a
#                       push-to-talk toggle.
#      "hold_to_talk" – live only while you hold M; muted otherwise, also while
#                       Apptrol is stopped.
#      talk_over = true – other apps go down while the microphone is live through M.
#   S  "cough"        – muted while you hold S (default; "off" with hold_to_talk)
#      "talk_over"    – other apps go down while you hold S
#      "off"
#   R  "off" (default), or a launcher
#
# Launchers start an app: app = a desktop ID (`apptrol list apps` shows them), or
# command = ["program", "argument"]. if_running = "start" (default) or "skip".
# Record, the three Marker buttons and any R button can be launchers.
#
# While the screen is locked, launchers start nothing, and every button pressed is
# logged as a warning. when_locked = true lets one launcher start anyway, for anyone
# at the controller; it is a warning on every load. docs/config.md, "At the lock screen".
#
# A command runs exactly what you write, with your user's rights: you are
# responsible for it, the authors accept no liability. A few catastrophic commands
# (rm -rf ~, mkfs, curl … | sh, sudo, …) are refused; docs/config.md lists them under
# "Blocked commands". That is a safety net against accidents, not protection.

[layouts.default.buttons]
# m8 = { mode = "hold_to_talk", talk_over = true }
# s8 = { mode = "talk_over" }
# r1 = { mode = "off" }                             # "play_pause" (default) or "off"
# r4 = { app = "steam", if_running = "skip" }
# record      = { app = "com.obsproject.Studio" }
# marker_prev = { command = ["konsole", "-e", "htop"] }

# ── Media keys ────────────────────────────────────────────────────────────────
# [media]
# player = "spotify"               # pin ◀◀ ▶▶ ■ ▶ to one app (default: the most recent player)
