# Apptrol configuration
# Location: ~/.config/apptrol/config.toml
# The file is reloaded automatically when you save it.
# Full reference: docs/config.md

# ── Controller ────────────────────────────────────────────────────────────────
[controller]
# ALSA card id of the controller (case-insensitive). It is the name in brackets
# in `cat /proc/asound/cards`, e.g. " 1 [nanoKONTROL2   ]: USB-Audio - nanoKONTROL2".
port = "nanoKONTROL2"

# ── Logging ───────────────────────────────────────────────────────────────────
[log]
level   = "warn"                   # debug | info | warn | error; "info" shows every
                                   # mute, solo and app found, for troubleshooting
outputs = ["journald"]             # "journald", "file", or both

[log.journald]
format = "text"                    # text | logfmt

[log.file]
path      = "~/.local/state/apptrol/apptrol.log"
format    = "json"                 # text | json | logfmt
max_size  = "10MB"                 # rotate when the file reaches this size
max_files = 5                      # rotated files to keep

# ── Apps and inputs ───────────────────────────────────────────────────────────
# Each entry is defined once and referred to by its id (the part after "apps.").
# `match` is a list of case-insensitive name fragments.
# Run `apptrol list` to see the names of everything that is currently playing.

[apps.spotify]
name  = "Spotify"
match = ["spotify"]
# max_volume = 150                 # % at the top of the control (1–150, default 100)

[apps.browser]
name  = "Browser"
match = ["vivaldi", "firefox", "chrome"]

[apps.discord]
name  = "Discord"
match = ["discord", "vesktop"]

[apps.games]
name  = "Steam games"
match = ["steam"]

[apps.mic]
name  = "Microphone"
type  = "input"                    # "app" (default) or "input"
match = ["GoXLR"]                  # part of the input device's name
# talk_over_volume = 25            # % apps go down to during talk-over (0–100, default 25)

# ── Layouts ───────────────────────────────────────────────────────────────────
# Phase 1 uses only the layout called "default".
# Controls: slider1–slider8 and knob1–knob8 (numbered left to right).
# S / M buttons belong to the slider in the same column.

[layouts.default]
slider1 = "spotify"
slider2 = "browser"
slider3 = "discord"
slider4 = "games"
slider8 = "mic"

# ── Buttons ───────────────────────────────────────────────────────────────────
# Every button has a default; uncomment a line to change it. Full list: docs/config.md
#
# On a column with an app:  S = solo, M = mute, R = play / pause that app.
# On a column with an input (microphone):
#   M  "mute"         – press: muted, press again: live (default). Works as a
#                       push-to-talk toggle.
#      "hold_to_talk" – live only while you hold M; muted otherwise, also while
#                       Apptrol is stopped.
#      talk_over = true – other apps go down while the microphone is live through M.
#   S  "cough"        – muted while you hold S (default; "off" with hold_to_talk)
#      "talk_over"    – other apps go down while you hold S
#      "off"
#   R  "off" (default), or a launcher
#
# Launchers start an app: app = a desktop ID (`apptrol list apps` shows them), or
# command = ["program", "argument"]. if_running = "start" (default) or "skip".
# Record, the three Marker buttons and any R button can be launchers.
# (Starting apps arrives later in 0.2.0.)

[layouts.default.buttons]
# m8 = { mode = "hold_to_talk", talk_over = true }
# s8 = { mode = "talk_over" }
# r1 = { mode = "off" }                             # "play_pause" (default) or "off"
# r4 = { app = "steam", if_running = "skip" }
# record      = { app = "com.obsproject.Studio" }
# marker_prev = { command = ["konsole", "-e", "htop"] }

# ── Media keys ────────────────────────────────────────────────────────────────
# [media]
# player = "spotify"               # pin ◀◀ ▶▶ ■ ▶ to one app (default: the most recent player)
