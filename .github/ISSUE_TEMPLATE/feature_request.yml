name: Feature request
description: Suggest a new feature or a change
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [roadmap](https://github.com/Dzobash/apptrol/blob/main/docs/roadmap.md)
        first — your idea may already be planned for a later phase.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not the solution yet.
      placeholder: When I switch between work and gaming, I have to re-assign apps by editing the config…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: How should it work?
      description: Which controls, which config options, what should happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you have considered or currently use.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the roadmap and existing issues
          required: true
