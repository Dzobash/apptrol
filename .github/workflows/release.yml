# Release: runs when a version tag (v*) is pushed.
# Builds binaries, .deb/.rpm packages and checksums with GoReleaser
# and publishes them as a GitHub Release. See docs/releasing.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the GitHub Release and upload files
  id-token: write      # sign the attestations (keyless, through Sigstore)
  attestations: write  # store them with the repository

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history for the version and release notes
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test before releasing
        run: go test -race ./...
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every file people download, so a download can be
      # checked for tampering, not only for damage:
      # gh attestation verify <file> --repo Dzobash/apptrol (NFR-05, #74).
      - name: Attest the release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/checksums.txt
