# Continuous integration: runs on every push and pull request.
# What each job checks is described in docs/adr/0012-testing-strategy.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimum total test coverage in percent (QA-04). Raised as Phase 1 adds code.
  COVERAGE_MIN: "75"

jobs:
  # Advisory until the per-distro evidence gate in #172 is met (QA-16, ADR 0034).
  systemd:
    name: Systemd in containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Prepare rootless Podman and delegated user manager (QA-16, ADR 0037)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            podman uidmap slirp4netns fuse-overlayfs crun dbus-user-session
          # The runner clears PATH before building. Expose setup-go's toolchain
          # through that fixed PATH, without accepting caller environment values.
          go_root=$(go env GOROOT)
          if test "$(readlink -f /usr/local/go)" != "$go_root"; then
            if test -d /usr/local/go && ! test -L /usr/local/go; then
              sudo mv /usr/local/go /usr/local/go.pre-apptrol-ci
            fi
            sudo ln -sfn "$go_root" /usr/local/go
          fi
          runner_user=$(id -un)
          runner_uid=$(id -u)
          # Preserve usable mappings; allocate above all existing ranges otherwise.
          next_id=$(awk -F: 'BEGIN {end=1000000} $2+$3>end {end=$2+$3} END {print end}' /etc/subuid /etc/subgid)
          if ! awk -F: -v name="$runner_user" -v uid="$runner_uid" \
            '($1==name || $1==uid) && $3>=65536 {ok=1} END {exit !ok}' /etc/subuid; then
            sudo usermod --add-subuids "$next_id-$((next_id+65535))" "$runner_user"
          fi
          if ! awk -F: -v name="$runner_user" -v uid="$runner_uid" \
            '($1==name || $1==uid) && $3>=65536 {ok=1} END {exit !ok}' /etc/subgid; then
            sudo usermod --add-subgids "$next_id-$((next_id+65535))" "$runner_user"
          fi
          # Only this disposable VM: permit unprivileged user namespaces without
          # disabling AppArmor itself. No container engine runs through sudo.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          if test "$(sysctl -n user.max_user_namespaces)" = 0; then
            sudo sysctl -w user.max_user_namespaces=28633
          fi
          test -e /sys/fs/cgroup/cgroup.controllers
          sudo mkdir -p "/etc/systemd/system/user@$runner_uid.service.d"
          printf '[Service]\nDelegate=memory pids\n' | \
            sudo tee "/etc/systemd/system/user@$runner_uid.service.d/apptrol-ci.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$runner_user"
          # Ubuntu's systemd cannot change DelegateControllers through set-property.
          # Restart this disposable runner's user manager to apply the drop-in.
          sudo systemctl restart "user@$runner_uid.service"
          export XDG_RUNTIME_DIR="/run/user/$runner_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          } >> "$GITHUB_ENV"
          echo 'Rootless prerequisites ready; the script will prove build and runtime limits.'
      - name: Check Status line on Ubuntu 26.04 and Fedora 44 (SVC-13)
        run: make test-systemd AGENT=ci
      - name: Host confinement diagnostics on failure (QA-16)
        if: failure()
        # Host policy can attach to helpers inside a rootless container. Keep
        # evidence in this disposable runner's log; never change policy silently.
        run: sudo journalctl --kernel --no-pager --grep='apparmor|DENIED' -n 100
      - name: Upload container audit, including failed-run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: systemd-container-audit
          path: .audit/
          include-hidden-files: true
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      # The metadata software centers show for the packages (ADR 0013, notes).
      - name: AppStream metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream
          appstreamcli validate --no-net packaging/appstream/*.metainfo.xml

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version from go.mod, and the newest stable release.
        include:
          - go: minimum
            go-version-file: go.mod
          - go: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
      - name: Start a session bus and a headless PipeWire for the integration tests (QA-09)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pipewire pipewire-pulse wireplumber pulseaudio-utils dbus
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          dbus-daemon --session --address="$DBUS_SESSION_BUS_ADDRESS" --fork --nopidfile
          # Start the servers in order and wait for each, as a desktop session
          # does: WirePlumber and pipewire-pulse connect to PipeWire. The 30 s
          # are only a limit for a slow runner; it is ready within a second
          # (#166). On failure the step prints the servers' logs.
          wait_for() {
            what=$1; shift
            for _ in $(seq 150); do "$@" >/dev/null 2>&1 && return 0; sleep 0.2; done
            echo "::error::$what was not ready within 30 s"
            tail -n 50 "$RUNNER_TEMP"/*.log
            return 1
          }
          pipewire >"$RUNNER_TEMP/pipewire.log" 2>&1 &
          wait_for "PipeWire" test -S "$XDG_RUNTIME_DIR/pipewire-0"
          wireplumber >"$RUNNER_TEMP/wireplumber.log" 2>&1 &
          pipewire-pulse >"$RUNNER_TEMP/pipewire-pulse.log" 2>&1 &
          wait_for "pipewire-pulse" pactl info
          # A silent output, as a desktop has one; streams on the dummy output fail.
          pactl load-module module-null-sink sink_name=ci_out
          pactl info
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "APPTROL_PULSE_TEST=1"
            echo "APPTROL_DBUS_TEST=1"
          } >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Audio servers' logs, when a step failed (#166)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP"/*.log || true
      - name: Coverage report and minimum
        if: matrix.go == 'minimum'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          {
            echo "### Test coverage: ${total}% (minimum ${COVERAGE_MIN}%)"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$COVERAGE_MIN" 'BEGIN { if (t+0 < m+0) { printf "Coverage %s%% is below the minimum of %s%%\n", t, m; exit 1 } }'
      - name: Upload coverage profile
        if: matrix.go == 'minimum'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run every fuzz test briefly (QA-08)
        run: |
          for pkg in $(go list ./...); do
            for fn in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              echo "::group::$pkg $fn"
              go test -run '^$' -fuzz "^${fn}\$" -fuzztime 20s "$pkg"
              echo "::endgroup::"
            done
          done

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Latest stable Go: govulncheck itself needs a recent Go, and release binaries
      # are built with the latest stable Go, so its standard library is what we check.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the version comes from git tags
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Build portable packages for Windows (NFR-11)
        run: make check-portable
      - name: Smoke test
        run: ./bin/apptrol --version
      - name: Third-party licenses (generated for every release; fails on an unknown license)
        run: make third-party-licenses

  # The release build and the .deb are only otherwise tried when a release candidate is
  # tagged (release.yml), so a broken .goreleaser.yaml or package would show up only
  # then (NFR-05, NFR-08, NFR-09, #146). No path filter: the ruleset on main wants its
  # checks on every pull request, and a job that is skipped counts as missing.
  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, so the snapshot version and changelog come from git
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # as release.yml: release binaries are built with the latest stable Go
      # Same GoReleaser as release.yml; only installed here, then run through make so
      # CI and a developer's machine run the same commands.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: Check .goreleaser.yaml
        run: make release-check
      # Everything release.yml builds, without publishing and without secrets.
      - name: Snapshot build (binaries, archives, .deb, .rpm)
        run: make snapshot
      - name: Lintian on the .deb (errors fail, warnings are only printed)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lintian
          ls -l dist/*.deb
          # --fail-on error: only E: tags fail the job; W: and I: tags are printed.
          # Lintian hides I: tags unless --display-info is given; --info only adds
          # the explanation under each tag that is shown.
          # Each suppressed tag is a deliberate difference between a package that
          # GoReleaser builds and one that Debian's tools build from a source package:
          #   no-changelog              Debian wants changelog.Debian.gz, which comes from
          #                             debian/changelog. We ship CHANGELOG.md instead
          #                             (Keep a Changelog, under /usr/share/doc/apptrol).
          #   statically-linked-binary  Apptrol is built with CGO_ENABLED=0 on purpose:
          #                             one static binary with no library dependencies
          #                             (ADR 0013).
          lintian --info --display-info --fail-on error \
            --suppress-tags no-changelog,statically-linked-binary \
            dist/*.deb
