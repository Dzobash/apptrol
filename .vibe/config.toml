permission = "always"

[tools."t3-code_t3_thread_search"]
permission = "always"

[tools."t3-code_t3_project_list"]
permission = "always"

[tools."t3-code_t3_project_read"]
permission = "always"

[tools."t3-code_list_thread_pull_requests"]
permission = "always"

[tools."t3-code_read_pull_request_guide"]
permission = "always"

[tools."t3-code_task_status"]
