applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
permission = "ask"
allowlist = [
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "file",
    "find",
    "fmt",
    "fold",
    "gh cache list",
    "gh issue list",
    "gh issue status",
    "gh issue view",
    "gh label list",
    "gh pr checks",
    "gh pr diff",
    "gh pr list",
    "gh pr status",
    "gh pr view",
    "gh release list",
    "gh release view",
    "gh repo list",
    "gh repo view",
    "gh ruleset check",
    "gh ruleset list",
    "gh ruleset view",
    "gh run list",
    "gh run view",
    "gh run watch",
    "gh search",
    "gh status",
    "gh workflow list",
    "gh workflow view",
    "git add",
    "git branch --list",
    "git branch --show-current",
    "git branch -a",
    "git check-ignore",
    "git commit",
    "git diff",
    "git fetch",
    "git log",
    "git ls-files",
    "git ls-tree",
    "git pull",
    "git show",
    "git status",
    "git switch",
    "git tag --list",
    "git tag --sort=-creatordate",
    "git tag -l",
    "git worktree list",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "make check",
    "make container-run",
    "make test-audio",
    "make test-clean",
    "make test-install",
    "make test-systemd",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "wc",
    "which",
]
denylist = [
    "gdb",
    "pdb",
    "passwd",
    "nano",
    "vim",
    "vi",
    "emacs",
    "bash -i",
    "sh -i",
    "zsh -i",
    "fish -i",
    "dash -i",
    "screen",
    "tmux",
    "docker",
    "podman",
    "buildah",
]

